  ic_globe: ic_globe
  ic_arrow_down: ic_arrow
  ic_arrow_up: ic_arrow
  # icons
  ic_error: error_icon
  # screen icons
  ic_construction: screen_icon
  # button icons
  ic_search: button_icon
  ic_settings: button_icon
  ic_power: button_icon
  ic_dropleft: button_arrow
  ic_dropright: button_arrow
  # QR code
  qr_rec: qr_rec
  # keycap icons for detachables
  ic_volume_up: ic_arrow
  ic_volume_down: ic_arrow
  ic_power_settings_new: ic_arrow

# Google Material 3 (GM3) dark theme colors
# See https://carbon.googleplex.com/google-material-3/pages/static/gm3-baseline.
color_aliases:
  - &primary '#a8c7fa'
  - &surface_container '#1e1f20'
  - &surface_container_high '#282a2c'
  - &on_surface '#e3e3e3'
  - &on_surface_variant '#c4c7c5'

# Style of each category
styles:
  _DEFAULT_:
    # The colors of these bitmaps will be adjusted at runtime.
    bgcolor: '#000000'
    fgcolor: '#ffffff'
    # Height of the generated bitmap relative to the screen resolution specified
    # in boards.yaml, using 1080 as a base. For example, "height: 54" means the
    # image will be scaled to 5% of the screen height. These scale-related
    # numbers are supposed to be kept in sync with the those set in depthcharge,
    # to ensure the size of the generated bitmap will be proportional to the
    # size that it is displayed at. For text, this is the height of each line,
    # that is, the font size in the design times LINE_HEIGHT_RATIO in build.py.
    height: 23
    # Maximum width of the bitmap for wrapping lines. Unit is the same as the
    # "height" option.
    max_width: null
    max_num_lines: null
  _GLYPH_:
    height: 20
  title:
    bgcolor: *surface_container
    fgcolor: *on_surface
    height: 59
    # UI_SCALE = 1080
    # UI_MARGIN_H = 72
    # UI_SCALE - UI_MARGIN_H * 2
    max_width: 936
  desc:
    bgcolor: *surface_container
    fgcolor: *on_surface
    # UI_SCALE - UI_MARGIN_H * 2
    max_width: 936
  one_line_desc:
    bgcolor: *surface_container
    fgcolor: *on_surface
    # Same text size as the navigation bar labels (button), since the text
    # is drawn on the right of the navigation bar.
    height: 21
    # No max_width, so that the bitmap is not padded to the full width
    # when drawn on the right of the navigation bar.
  desc_url:
    bgcolor: *surface_container
    fgcolor: *on_surface
  button:
    height: 21
  footer:
    bgcolor: *surface_container
    fgcolor: *on_surface
    height: 21
    # UI_FOOTER_COL_PADDING_INNER = 24
    # UI_FOOTER_QR_BOX_SIZE = 102
    # UI_FOOTER_QR_BOX_MARGIN_R = 20
    # UI_SCALE / 2 - UI_MARGIN_H - UI_FOOTER_COL_PADDING_INNER
    # - UI_FOOTER_QR_BOX_SIZE - UI_FOOTER_QR_BOX_MARGIN_R
    max_width: 322
  footer_url:
    bgcolor: *surface_container
    fgcolor: *primary
    height: 21
  footer_nav:
    bgcolor: *surface_container
    fgcolor: *on_surface
    height: 21
    # UI_KEYCAP_SIZE = 40
    # UI_KEYCAP_SPACING = 6
    # UI_KEYCAP_MARGIN_R = 10
    # UI_SCALE / 2 - UI_MARGIN_H - UI_FOOTER_COL_PADDING_INNER
    # - UI_KEYCAP_SIZE * 2 - UI_KEYCAP_SPACING - UI_KEYCAP_MARGIN_R
    max_width: 348
  keycap:
    height: 21
  error:
    bgcolor: *surface_container_high
    fgcolor: *on_surface_variant
    height: 21
    # UI_ERROR_BOX_WIDTH - UI_ERROR_BOX_PADDING * 2
    max_width: 392
  error_url:
    bgcolor: *surface_container_high
    fgcolor: *on_surface_variant
    height: 21
  # sprite bitmaps
  ic_globe:
    height: 24
  ic_arrow:
    height: 24
  screen_icon:
    height: 50
  error_icon:
    height: 40
  button_icon:
    height: 24
  button_arrow:
    height: 20
  qr_rec:
    height: 86

